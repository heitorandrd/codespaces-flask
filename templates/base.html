<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NutriVida{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='rastreamento.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <header class="topo">
        <div class="logo"> NutriVida</div>
        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('calculadora') }}">Calculadora</a>
            <a href="{{ url_for('perfil') }}">Meu Perfil</a>
        </nav>
    </header>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">
        <p>&copy; 2026 NutriVida — Cuidando da sua alimentação</p>
    </footer>
</body>
</html>
