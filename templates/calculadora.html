<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="icon" href="{{ url_for('static', filename='rastreamento.ico') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Início</a> |
        <a href="{{ url_for('calculadora') }}">Calculadora</a>
    </nav>
    <hr>
    <h1>Calculadora</h1>
    <form action="{{ url_for('resultado') }}" method="POST">
        <input type="number" step="any" name="num1" placeholder="Primeiro número" required>
        <br><br>
        <select name="operacao">
            <option value="soma">+</option>
            <option value="subtracao">-</option>
            <option value="multiplicacao">×</option>
            <option value="divisao">÷</option>
        </select>
        <br><br>
        <input type="number" step="any" name="num2" placeholder="Segundo número" required>
        <br><br>
        <button type="submit">Calcular</button>
    </form>
</body>
</html>
